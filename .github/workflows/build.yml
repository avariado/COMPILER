name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract Android project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(find . -maxdepth 1 -type f -iname '*.zip' -printf '%f\n' | sort)

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "ERRO: não existe nenhum ficheiro .zip na raiz do repositório."
            exit 1
          fi

          if [ "${#ZIPS[@]}" -gt 1 ]; then
            echo "ERRO: existe mais do que um .zip na raiz do repositório:"
            printf '  - %s\n' "${ZIPS[@]}"
            echo "Deixa apenas o projeto que pretendes compilar."
            exit 1
          fi

          ZIP_FILE="${ZIPS[0]}"
          ZIP_NAME="${ZIP_FILE%.zip}"
          rm -rf _android_project
          mkdir _android_project
          unzip -q "$ZIP_FILE" -d _android_project

          mapfile -t SETTINGS < <(find _android_project -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print)

          if [ "${#SETTINGS[@]}" -eq 0 ]; then
            echo "ERRO: não foi encontrado settings.gradle/settings.gradle.kts dentro de $ZIP_FILE."
            exit 1
          fi

          if [ "${#SETTINGS[@]}" -gt 1 ]; then
            echo "ERRO: foram encontrados vários projetos Android dentro do ZIP:"
            printf '  - %s\n' "${SETTINGS[@]}"
            exit 1
          fi

          PROJECT_DIR="$(dirname "${SETTINGS[0]}")"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "ZIP: $ZIP_FILE"
          echo "Projeto Android: $PROJECT_DIR"

      - name: Install required Android SDK platform
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado no runner."
            exit 1
          fi

          COMPILE_SDK="$(grep -RhoE 'compileSdk(Version)?[[:space:]]*[= ]+[0-9]+' "$PROJECT_DIR" --include='*.gradle' --include='*.gradle.kts' 2>/dev/null | grep -oE '[0-9]+' | head -n 1 || true)"

          if [ -z "$COMPILE_SDK" ]; then
            COMPILE_SDK=35
            echo "compileSdk não detetado; será assegurado Android SDK 35."
          else
            echo "compileSdk detetado: $COMPILE_SDK"
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-$COMPILE_SDK" "platform-tools"

          BUILD_TOOLS="$(grep -RhoE 'buildToolsVersion[[:space:]]*[= ]*[\"'\''][0-9.]+[\"'\'']' "$PROJECT_DIR" --include='*.gradle' --include='*.gradle.kts' 2>/dev/null | grep -oE '[0-9]+(\.[0-9]+)+' | head -n 1 || true)"
          if [ -n "$BUILD_TOOLS" ]; then
            echo "buildToolsVersion detetado: $BUILD_TOOLS"
            "$SDKMANAGER" "build-tools;$BUILD_TOOLS"
          fi

      - name: Detect compatible Gradle version
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os, re
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])
          version = None

          # 1) Preferir a versão declarada pelo próprio projeto.
          wrapper = project / "gradle" / "wrapper" / "gradle-wrapper.properties"
          if wrapper.exists():
              text = wrapper.read_text(encoding="utf-8", errors="ignore")
              m = re.search(r"gradle-([0-9]+(?:\.[0-9]+){1,2})-(?:bin|all)\.zip", text)
              if m:
                  version = m.group(1)
                  print(f"Versão Gradle indicada pelo projeto: {version}")

          # 2) Sem versão de wrapper, detetar o Android Gradle Plugin.
          if not version:
              agp = None
              files = list(project.rglob("*.gradle")) + list(project.rglob("*.gradle.kts"))
              for f in files:
                  try:
                      text = f.read_text(encoding="utf-8", errors="ignore")
                  except Exception:
                      continue

                  patterns = [
                      r"com\.android\.tools\.build:gradle:([0-9]+(?:\.[0-9]+){1,2})",
                      r"(?:id\s*\(?\s*[\"']com\.android\.(?:application|library)[\"']\s*\)?|alias\([^)]*android[^)]*\))[^\n]*?version\s*[= ]*\(?\s*[\"']([0-9]+(?:\.[0-9]+){1,2})[\"']",
                  ]
                  for pat in patterns:
                      m = re.search(pat, text, re.I)
                      if m:
                          agp = m.group(1)
                          break
                  if agp:
                      break

              if agp:
                  print(f"Android Gradle Plugin detetado: {agp}")
                  parts = [int(x) for x in agp.split('.')[:2]]
                  major, minor = parts[0], parts[1] if len(parts) > 1 else 0

                  if major >= 9:
                      version = "9.1.0"
                  elif major == 8:
                      mapping = {
                          0: "8.2.1", 1: "8.2.1", 2: "8.2.1",
                          3: "8.4", 4: "8.6", 5: "8.7", 6: "8.7",
                          7: "8.9", 8: "8.10.2", 9: "8.11.1",
                          10: "8.13", 11: "8.13",
                      }
                      version = mapping.get(minor, "8.14.3")
                  else:
                      version = "8.2.1"
                  print(f"Gradle compatível selecionado: {version}")

          # 3) Último recurso.
          if not version:
              version = "8.14.3"
              print(f"Versões não detetadas; fallback Gradle: {version}")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"GRADLE_VERSION={version}\n")
          PY

      - name: Set up compatible Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64" || { echo "ERRO: falta KEYSTORE_BASE64."; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "ERRO: falta KEYSTORE_PASSWORD."; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ERRO: falta KEY_ALIAS."; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ERRO: falta KEY_PASSWORD."; exit 1; }

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$PROJECT_DIR/keystore.jks"
          printf 'storePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > "$PROJECT_DIR/keystore.properties"

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleRelease --stacktrace
          elif [ -f ./gradlew.bat ]; then
            echo "gradlew.bat existe, mas o runner é Linux; será usado o Gradle instalado."
            gradle clean assembleRelease --stacktrace
          else
            echo "Gradle Wrapper não encontrado; será usado Gradle $GRADLE_VERSION."
            gradle clean assembleRelease --stacktrace
          fi

      - name: Ensure APK is signed
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
            "$SDKMANAGER" "build-tools;35.0.0"
            APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          fi

          mkdir -p "$GITHUB_WORKSPACE/_release_apk"
          FOUND=0

          while IFS= read -r -d '' APK; do
            FOUND=1
            BASENAME="$(basename "$APK")"

            if "$APKSIGNER" verify "$APK" >/dev/null 2>&1; then
              cp "$APK" "$GITHUB_WORKSPACE/_release_apk/$BASENAME"
              echo "APK já assinado: $BASENAME"
            else
              OUT="$GITHUB_WORKSPACE/_release_apk/${BASENAME%.apk}-signed.apk"
              "$APKSIGNER" sign \
                --ks "$PROJECT_DIR/keystore.jks" \
                --ks-pass "pass:$KEYSTORE_PASSWORD" \
                --ks-key-alias "$KEY_ALIAS" \
                --key-pass "pass:$KEY_PASSWORD" \
                --out "$OUT" \
                "$APK"
              "$APKSIGNER" verify "$OUT"
              echo "APK assinado pelo workflow: $(basename "$OUT")"
            fi
          done < <(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/release/*.apk' -print0)

          if [ "$FOUND" -eq 0 ]; then
            echo "ERRO: a compilação terminou mas não foi encontrado nenhum APK Release."
            exit 1
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}-release
          path: _release_apk/*.apk
          if-no-files-found: error
          retention-days: 30
